name: jasmina
description: Jasmin personal AI assistant
publish_to: "none"
version: 2.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  model_viewer_plus: ^1.10.0
  android_intent_plus: 6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/jasmin_avatar.glb
